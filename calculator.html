<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Calculator</title>
  <style>
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #1c1c1c; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh; 
      padding: 15px;
    }

    .calculator {
      width: 100%;
      max-width: 380px; 
      background-color: #2d2d2d;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    
    .display {
      background-color: #1c1c1c;
      padding: 25px 20px;
      text-align: right;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      word-wrap: break-word;
      word-break: break-all;
    }

    .previous-operand {
      color: rgba(255, 255, 255, 0.5);
      font-size: 18px;
      margin-bottom: 10px;
      min-height: 24px;
    }

    .current-operand {
      color: white;
      font-size: 42px;
      font-weight: 300;
    }

   
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 20px;
    }

 
    button {
      border: none;
      outline: none;
      border-radius: 50%;
      font-size: 22px;
      height: 65px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent; 
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-number {
      background-color: #333333;
      color: white;
    }

    .btn-number:hover {
      background-color: #444444;
    }

    .btn-operator {
      background-color: #ff9500;
      color: white;
      font-size: 28px;
    }

    .btn-operator:hover {
      background-color: #ffaa33;
    }

    .btn-operator.active {
      background-color: white;
      color: #ff9500;
    }


    .btn-special {
      background-color: #a5a5a5;
      color: #1c1c1c;
      font-weight: bold;
    }

    .btn-special:hover {
      background-color: #bbbbbb;
    }


    .btn-zero {
      grid-column: span 2; 
      border-radius: 40px;
      justify-content: flex-start;
      padding-left: 28px;
    }

   
    @media (max-width: 380px) {
      .buttons {
        gap: 8px;
        padding: 12px;
      }
      button {
        height: 58px;
        font-size: 20px;
      }
      .current-operand {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>

  <div class="calculator">
   
    <div class="display">
      <div class="previous-operand" id="previous-operand"></div>
      <div class="current-operand" id="current-operand">0</div>
    </div>

    <div class="buttons">
      <button class="btn-special" data-action="clear">AC</button>
      <button class="btn-special" data-action="negate">+/-</button>
      <button class="btn-special" data-action="percent">%</button>
      <button class="btn-operator" data-action="operator" data-value="÷">÷</button>

      <button class="btn-number" data-action="number" data-value="7">7</button>
      <button class="btn-number" data-action="number" data-value="8">8</button>
      <button class="btn-number" data-action="number" data-value="9">9</button>
      <button class="btn-operator" data-action="operator" data-value="×">×</button>

      <button class="btn-number" data-action="number" data-value="4">4</button>
      <button class="btn-number" data-action="number" data-value="5">5</button>
      <button class="btn-number" data-action="number" data-value="6">6</button>
      <button class="btn-operator" data-action="operator" data-value="-">−</button>

      <button class="btn-number" data-action="number" data-value="1">1</button>
      <button class="btn-number" data-action="number" data-value="2">2</button>
      <button class="btn-number" data-action="number" data-value="3">3</button>
      <button class="btn-operator" data-action="operator" data-value="+">+</button>

      <button class="btn-number btn-zero" data-action="number" data-value="0">0</button>
      <button class="btn-number" data-action="decimal">.</button>
      <button class="btn-operator" data-action="equals">=</button>
    </div>
  </div>

  <script>
    // Variables
    const previousOperandElement = document.getElementById('previous-operand');
    const currentOperandElement = document.getElementById('current-operand');
    
    let currentOperand = '0';
    let previousOperand = '';
    let operation = undefined;
    let shouldResetScreen = false;

    const buttons = document.querySelectorAll('button');
    buttons.forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        const value = button.dataset.value;

        switch(action) {
          case 'number':
            appendNumber(value);
            break;
          case 'operator':
            chooseOperator(value);
            break;
          case 'decimal':
            addDecimal();
            break;
          case 'equals':
            compute();
            break;
          case 'clear':
            clear();
            break;
          case 'negate':
            negateNumber();
            break;
          case 'percent':
            applyPercent();
            break;
        }
        updateDisplay();
      });
    });


    function appendNumber(number) {
      if (shouldResetScreen) {
        currentOperand = '';
        shouldResetScreen = false;
      }
      
      if (currentOperand === '0' && number === '0') return;
     
      if (currentOperand === '0' && number !== '0') {
        currentOperand = number;
        return;
      }
      
      if (currentOperand.length > 12) return;
      
      currentOperand += number;
    }

    function addDecimal() {
      if (shouldResetScreen) {
        currentOperand = '0';
        shouldResetScreen = false;
      }
      
      if (currentOperand.includes('.')) return;
      if (currentOperand === '') currentOperand = '0';
      currentOperand += '.';
    }

    function chooseOperator(operator) {
      if (currentOperand === '') return;
      if (previousOperand !== '') {
        compute();
      }
      operation = operator;
      previousOperand = currentOperand;
      shouldResetScreen = true;
      
      highlightOperator(operator);
    }

    function compute() {
      let result;
      const prev = parseFloat(previousOperand);
      const current = parseFloat(currentOperand);
      
      if (isNaN(prev) || isNaN(current)) return;

      switch(operation) {
        case '+': result = prev + current; break;
        case '-': result = prev - current; break;
        case '×': result = prev * current; break;
        case '÷': 
          if(current === 0) {
            alert("Cannot divide by zero!");
            clear();
            return;
          }
          result = prev / current; 
          break;
        default: return;
      }

  
      currentOperand = parseFloat(result.toPrecision(10)).toString();
      operation = undefined;
      previousOperand = '';
      shouldResetScreen = true;
      removeHighlightOperators();
    }

    function clear() {
      currentOperand = '0';
      previousOperand = '';
      operation = undefined;
      removeHighlightOperators();
    }

    function negateNumber() {
      if (currentOperand === '' || currentOperand === '0') return;
      currentOperand = currentOperand.startsWith('-') ? currentOperand.slice(1) : '-' + currentOperand;
    }

    function applyPercent() {
      if (currentOperand === '' || currentOperand === '0') return;
      currentOperand = (parseFloat(currentOperand) / 100).toString();
    }

    function updateDisplay() {
      currentOperandElement.innerText = currentOperand;
      if (operation != null) {
        previousOperandElement.innerText = `${previousOperand} ${operation}`;
      } else {
        previousOperandElement.innerText = '';
      }
    }

    function highlightOperator(op) {
      removeHighlightOperators();
      document.querySelectorAll('.btn-operator').forEach(btn => {
        if(btn.dataset.value === op) {
          btn.classList.add('active');
        }
      });
    }

    function removeHighlightOperators() {
      document.querySelectorAll('.btn-operator').forEach(btn => {
        btn.classList.remove('active');
      });
    }

  
    updateDisplay();
  </script>

</body>
</html>
